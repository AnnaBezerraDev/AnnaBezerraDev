<svg fill="none" viewBox="0 0 800 80" width="100%" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd93f9">
        <animate attributeName="stop-color" values="#bd93f9;#ff79c6;#50fa7b;#bd93f9" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff79c6">
        <animate attributeName="stop-color" values="#ff79c6;#8be9fd;#bd93f9;#ff79c6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8be9fd">
        <animate attributeName="stop-color" values="#8be9fd;#bd93f9;#ff79c6;#8be9fd" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Waves inverted for footer -->
  <path d="M0 55 C 200 25, 380 65, 560 30 C 680 10, 740 45, 800 25 L 800 0 L 0 0 Z" fill="url(#footerWaveGrad)" opacity="0.25" />
  <path d="M0 40 C 180 15, 340 50, 520 25 C 660 10, 720 40, 800 30 L 800 0 L 0 0 Z" fill="url(#footerWaveGrad)" opacity="0.5" />
  <path d="M0 25 C 150 10, 300 35, 480 20 C 640 10, 720 30, 800 20 L 800 0 L 0 0 Z" fill="url(#footerWaveGrad)" />
</svg>
