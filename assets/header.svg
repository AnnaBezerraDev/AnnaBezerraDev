<svg fill="none" viewBox="0 0 800 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="50%" stop-color="#2d1b4e" />
      <stop offset="100%" stop-color="#0f0c29" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd93f9">
        <animate attributeName="stop-color" values="#bd93f9;#ff79c6;#50fa7b;#bd93f9" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff79c6">
        <animate attributeName="stop-color" values="#ff79c6;#8be9fd;#bd93f9;#ff79c6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8be9fd">
        <animate attributeName="stop-color" values="#8be9fd;#bd93f9;#ff79c6;#8be9fd" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8f8f2" />
      <stop offset="100%" stop-color="#bd93f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0.5px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 2px;
      fill: #8be9fd;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #6272a4;
    }
    .particle {
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); opacity: 0.3; }
      100% { transform: translateY(-8px); opacity: 0.8; }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#headerGrad)" />
  
  <!-- Glowing border line at top -->
  <rect x="0" y="0" width="100%" height="3" fill="url(#waveGrad)" />

  <!-- Ambient Light Circles -->
  <circle cx="10%" cy="20%" r="60" fill="#bd93f9" opacity="0.12" filter="url(#glow)" />
  <circle cx="85%" cy="30%" r="80" fill="#ff79c6" opacity="0.1" filter="url(#glow)" />
  <circle cx="50%" cy="85%" r="70" fill="#50fa7b" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Wave Bottom -->
  <path d="M0 165 C 200 135, 380 200, 560 165 C 680 140, 740 180, 800 160 L 800 220 L 0 220 Z" fill="url(#waveGrad)" opacity="0.25" />
  <path d="M0 175 C 180 155, 340 190, 520 170 C 660 155, 720 185, 800 175 L 800 220 L 0 220 Z" fill="url(#waveGrad)" opacity="0.5" />
  <path d="M0 190 C 150 170, 300 205, 480 185 C 640 170, 720 200, 800 190 L 800 220 L 0 220 Z" fill="url(#waveGrad)" />

  <!-- Decorative Tech Dots / Stars -->
  <circle cx="120" cy="50" r="2" fill="#50fa7b" class="particle" />
  <circle cx="680" cy="65" r="2.5" fill="#f1fa8c" class="particle" style="animation-delay: 1s;" />
  <circle cx="730" cy="110" r="1.5" fill="#bd93f9" class="particle" style="animation-delay: 2s;" />
  <circle cx="80" cy="115" r="2" fill="#ff79c6" class="particle" style="animation-delay: 1.5s;" />

  <!-- Text Contents (Centered) -->
  <text x="50%" y="82" text-anchor="middle" class="title">Olá, sou Anna Luiza 👋</text>
  <text x="50%" y="118" text-anchor="middle" class="subtitle">DESENVOLVEDORA FULL STACK &amp; IA</text>
  <text x="50%" y="142" text-anchor="middle" class="tagline">✦ CÓDIGO LIMPO &bull; DADOS &bull; ARQUITETURA MODERNA ✦</text>
</svg>
